
version: 2.1

jobs:
  test-and-build:
    docker:
      - image: cimg/node:22.23.4

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Run tests
          command: npm test -- --runInBand

      - run:
          name: Build NestJS
          command: npm run build

  deploy-render:
    docker:
      - image: cimg/base:stable

    steps:
      - run:
          name: Trigger Render deployment
          command: |
            if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
              echo "Missing RENDER_DEPLOY_HOOK_URL"
              exit 1
            fi

            curl --fail --silent --show-error \
              --retry 3 \
              --retry-delay 2 \
              --retry-connrefused \
              "$RENDER_DEPLOY_HOOK_URL"

workflows:
  deploy-pipeline:
    jobs:
      - test-and-build

      - deploy-render:
          requires:
            - test-and-build
          filters:
            branches:
              only: develop
