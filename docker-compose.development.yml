services:
  api:
    build:
      target: development
    env_file: .env.development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  postgres:
    env_file: .env.development
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ec_db_development}
    ports:
      - "5432:5432"
    volumes:
      - postgres_local:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_local:
