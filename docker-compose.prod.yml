services:
  api:
    build:
      target: production
    env_file: .env.production
    ports:
      - "3000:3000"
    restart: always

  postgres:
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ec_db_production}
    volumes:
      - postgres_prod:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_prod:
