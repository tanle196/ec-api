# docker-compose.local.yml
services:

  postgres:
    image: postgres:17-alpine
    env_file: .env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_local:
  node_modules: