services:
  api:
    build:
      target: production
    env_file: .env.staging
    ports:
      - "3000:3000"
    restart: unless-stopped

  postgres:
    env_file: .env.staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ec_db_staging}
    volumes:
      - postgres_staging:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_staging:
